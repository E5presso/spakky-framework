[project]
name = "spakky-grpc"
version = "8.0.0"
description = "gRPC plugin for Spakky framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Spakky", email = "sejong418@icloud.com" }]
dependencies = [
    "grpcio>=1.68.0",
    "grpcio-health-checking>=1.68.0",
    "grpcio-reflection>=1.68.0",
    "protobuf>=6.33.0",
    "pydantic>=2.4",
    "pydantic-settings>=2.13.1",
    "spakky>=8.0.0",
    "spakky-auth>=8.0.0",
    "spakky-tracing>=8.0.0",
]

[project.scripts]
spakky-grpc-descriptor-snapshot = "spakky.plugins.grpc.schema.snapshot:main"

[project.entry-points."spakky.plugins"]
spakky-grpc = "spakky.plugins.grpc.main:initialize"

[dependency-groups]
dev = [
    "cryptography>=45.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-integration-mark>=0.2.0",
    "types-grpcio>=1.0.0.20260614",
    "types-protobuf>=7.34.1.20260518",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "spakky.plugins.grpc"

[tool.pyrefly]
python-version = "3.12"
# grpcio-health-checking / grpcio-reflection ship no py.typed marker, so their
# public surface is untyped for pyrefly. Treat both as untyped rather than
# scattering per-line suppressions across the standard-service wiring.
replace-imports-with-any = ["grpc_health.*", "grpc_reflection.*"]
search_path = ["src", "."]
project_excludes = ["**/__pycache__", "**/*.pyc"]

[tool.ruff]
builtins = ["_"]
cache-dir = "~/.cache/ruff"

[tool.pytest.ini_options]
pythonpath = "src/spakky/plugins/grpc"
testpaths = "tests"
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = """
    --cov
    --cov-report=term
    --cov-report=xml
    --no-cov-on-fail
    --strict-markers
    --dist=load
    -p no:warnings
    -n auto
    --spec
    --with-integration
"""
spec_test_format = "{result} {docstring_summary}"

[tool.coverage.run]
include = ["src/spakky/plugins/grpc/**/*.py"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 100
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
    "@(typing\\.)?overload",
]

[tool.uv.sources]
spakky = { workspace = true }
spakky-auth = { workspace = true }
spakky-tracing = { workspace = true }
